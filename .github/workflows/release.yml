name: Release
# Run by hand when a version is ready: builds the zip from plugin.json's version and publishes it as GitHub Release
# v<version>, for upload to the Pelican Hub. The panel never reads this release: updates come from the Hub only.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugin.json'))['version'])")
          if gh release view "v$version" >/dev/null 2>&1; then echo "Release v$version already exists."; exit 1; fi
          zip=$(python3 scripts/build-package.py)
          awk -v head="## $version" 'index($0, head) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "v$version" "$zip" --target "$GITHUB_SHA" --title "Simplify Server Maker $version" --notes-file notes.md --latest
