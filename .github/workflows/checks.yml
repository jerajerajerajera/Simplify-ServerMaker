name: Checks
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  # A change to text only (docs, Markdown) skips the panel: tests and pint still run, so the check stays green.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="origin/${{ github.base_ref }}" ;;
            push) base="${{ github.event.before }}" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          files=$(git diff --name-only "$base" HEAD 2>/dev/null) || files=unknown
          printf 'Changed:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -qvE '^(docs/|LICENSE|.*\.md$)'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "::notice::Text only: the panel smoke is skipped"; fi
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: bash tests/run.sh
      - run: bash tests/docs-sync.sh
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: pint
      - run: pint --test
  # Installs the plugin in a real Pelican panel and opens its pages, so an error that only shows when the panel loads the code blocks the merge.
  panel-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pelican: '1.0.0-beta38'
            php: '8.3'
          - pelican: '1.0.0-rc.2'
            php: '8.4'
          # With the real Simplify core (main), not a stub: the add-on opens inside Simplify (P-1).
          - pelican: '1.0.0-rc.2'
            php: '8.4'
            simplify: 'main'
    name: panel-smoke (Pelican ${{ matrix.pelican }}${{ matrix.simplify && format(', Simplify {0}', matrix.simplify) || '' }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican ${{ matrix.pelican }}
        run: |
          git clone --quiet --depth 1 --branch "v${{ matrix.pelican }}" https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '${{ matrix.pelican }}'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=true/; s#^APP_URL=.*#APP_URL=http://localhost#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=database\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          yarn install --silent
      # Until 1.1.0 the plugin id was simplify-server-maker: install that version first, so the job proves the new id
      # takes over its settings and removes the old folder.
      - name: Install Simplify ${{ matrix.simplify }}
        if: matrix.simplify
        run: |
          git clone --quiet --depth 1 --branch "${{ matrix.simplify }}" https://github.com/jerajerajerajera/simplify.git panel/plugins/simplify
          rm -rf panel/plugins/simplify/.git
          cd panel
          php artisan p:plugin:install simplify
          php artisan p:plugin:list | grep -E '\| Simplify .*\| enabled' || { echo 'Simplify did not install'; exit 1; }
      - name: Install the old simplify-server-maker 1.0.5
        run: |
          git clone --quiet --depth 1 --branch v1.0.5 "https://github.com/${{ github.repository }}.git" panel/plugins/simplify-server-maker
          rm -rf panel/plugins/simplify-server-maker/.git
          cd panel
          php artisan p:plugin:install simplify-server-maker
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $db->exec("INSERT INTO simplify_server_maker_settings (key, value) VALUES (\"ci_takeover\", \"kept\")");'
      - name: Install Simplify Server Maker
        run: |
          mkdir -p panel/plugins/simplify-servermaker
          tar -C plugin --exclude=.git --exclude=dist -cf - . | tar -C panel/plugins/simplify-servermaker -xf -
          cd panel
          # As Admin → Plugins and the Hub install it: in a queue job.
          php artisan tinker --execute="App\Jobs\Plugin\InstallPlugin::dispatch(App\Models\User::factory()->create(), 'simplify-servermaker');"
          php artisan queue:work --max-jobs=1 --stop-when-empty
          php artisan p:plugin:list | tee plugins.txt
          grep -E 'Simplify Server Maker .*\| enabled' plugins.txt || { echo 'Simplify Server Maker did not install'; exit 1; }
          test ! -e plugins/simplify-server-maker || { echo 'The old simplify-server-maker folder is still there'; exit 1; }
          test "$(grep -c 'Simplify Server Maker' plugins.txt)" = 1 || { echo 'Simplify Server Maker is listed twice'; exit 1; }
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $kept = $db->query("SELECT value FROM simplify_server_maker_settings WHERE key = \"ci_takeover\"")->fetchColumn(); $db->exec("DELETE FROM simplify_server_maker_settings WHERE key = \"ci_takeover\""); exit($kept === "kept" ? 0 : 1);' || { echo 'The old settings were lost'; exit 1; }
      - name: PHPStan (level 5, in the panel)
        if: matrix.simplify == 'main' # the add-on's classes extend the core's
        working-directory: panel
        run: |
          composer require --dev larastan/larastan --no-interaction --no-progress --quiet
          # Without a baseline yet: the first run writes one and prints it, to commit as the starting point (every
          # finding in it is on the clean-up list; new code must be clean).
          if [ -f plugins/simplify-servermaker/phpstan-baseline.neon ]; then
            vendor/bin/phpstan analyse --configuration plugins/simplify-servermaker/phpstan.neon --memory-limit 1G --no-progress --error-format=github
          else
            vendor/bin/phpstan analyse --configuration plugins/simplify-servermaker/phpstan.neon --memory-limit 1G --no-progress --generate-baseline=plugins/simplify-servermaker/phpstan-baseline.neon --allow-empty-baseline
            echo '::group::phpstan-baseline.neon'; cat plugins/simplify-servermaker/phpstan-baseline.neon; echo '::endgroup::'
          fi
      - name: Open the pages
        working-directory: panel
        run: |
          # Laravel can end a crashed script with exit code 0, so the job also needs the closing line.
          php plugins/simplify-servermaker/tests/panel/smoke.php | tee smoke.txt
          grep -q '^All steps passed$' smoke.txt
      # Toolkit changes the wizard (MOTD maker, backup schedule): install it after the steps above and check those.
      - name: Install Simplify Toolkit and open the pages again
        working-directory: panel
        run: |
          git clone --quiet --depth 1 https://github.com/jerajerajerajera/simplify-mods.git plugins/simplify-toolkit
          rm -rf plugins/simplify-toolkit/.git
          php artisan p:plugin:install simplify-toolkit
          php plugins/simplify-servermaker/tests/panel/toolkit.php | tee toolkit.txt
          grep -q '^All steps passed$' toolkit.txt
      - name: Laravel log
        if: failure()
        run: grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 12 || true
